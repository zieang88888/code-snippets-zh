  <g>
    <rect x="780" y="570" width="360" height="180" fill="#FFFFFF" stroke="#B23A2E" stroke-width="2"/>
    <text x="800" y="605" font-size="18" font-weight="bold" fill="#B23A2E">09 Python 实用</text>
